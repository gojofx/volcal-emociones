<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcán Interactivo con Barra de Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f111a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 12px 16px;
        }

        h1 {
            margin-top: 15px;
            font-size: clamp(1.35rem, 5vw, 2rem);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Escenario Principal. La altura escala de forma continua con el viewport
           (420px de escritorio a 260px en móvil, el mínimo que sigue conteniendo
           al volcán de 260px sin recortarlo) para no dejar cielo vacío de sobra. */
        .stage {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: clamp(260px, calc(37.65vw + 118.8px), 420px);
            margin: 15px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            background: #74b9ff; /* Se modifica dinámicamente con JS */
            transition: background 0.2s linear;
        }

        /* Sol / Astro */
        .sun {
            position: absolute;
            top: 40px;
            right: 60px;
            width: 60px;
            height: 60px;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffd700;
            transition: all 0.2s linear;
        }

        /* Contenedor de Partículas (Humo, Lava) */
        .particle-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Nubes procedurales, ajenas al estado del volcán */
        .cloud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            animation: cloudDrift linear forwards;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud::before {
            width: 55%;
            height: 140%;
            top: -70%;
            left: 8%;
        }

        .cloud::after {
            width: 40%;
            height: 110%;
            top: -55%;
            right: 12%;
        }

        @keyframes cloudDrift {
            from { transform: translateX(0); }
            to { transform: translateX(var(--dist)); }
        }

        /* Contenedor del Volcán */
        .volcano-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            height: 260px;
            z-index: 1;
        }

        /* Silueta del Volcán */
        .volcano {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #4a3b32;
            clip-path: polygon(30% 25%, 70% 25%, 100% 100%, 0% 100%);
            transition: background-color 0.3s, opacity 0.4s ease;
        }

        /* Textura rocosa: vetas de un tono más claro que la base, recortadas a la
           misma silueta del cono, en forma de ondas fijas (sin animación). */
        .volcano::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(30% 25%, 70% 25%, 100% 100%, 0% 100%);
            background: repeating-linear-gradient(
                170deg,
                rgba(107, 83, 68, 0.55) 0px,
                rgba(107, 83, 68, 0.55) 12px,
                transparent 12px,
                transparent 32px
            );
            background-size: 160% 160%;
            pointer-events: none;
        }

        .volcano-details {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #382c25;
            clip-path: polygon(45% 25%, 70% 25%, 100% 100%, 55% 100%);
            transition: opacity 0.4s ease;
        }

        /* Corte interior: se revela con el mismo contorno del volcán al pasar el mouse.
           z-index por encima del cráter/ríos de lava (z-index:2) para que la animación
           de olas del conducto no quede tapada por ellos. */
        .volcano-interior {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(30% 25%, 70% 25%, 100% 100%, 0% 100%);
            background: linear-gradient(180deg, #6b5344 0%, #4a3b32 55%, #3a2d25 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 3;
        }

        /* Chimenea: conducto de magma que sube hacia el cráter. El borde superior no es
           recto: una máscara con forma de ola recorta el propio contorno de la superficie,
           y esa máscara se anima para que la ola "viaje" y esconda el borde recto. */
        .volcano-interior::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 40%;
            height: var(--conduit-height, 25%);
            transition: height 0.3s ease;
            background: linear-gradient(180deg, #ff3838 0%, #ff8c00 60%, #ffd23f 100%);
            -webkit-mask:
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 16"><path d="M0,8 C8,2 8,2 16,8 C24,14 24,14 32,8 L32,16 L0,16 Z" fill="white"/></svg>') top / 32px 16px repeat-x,
                linear-gradient(#fff, #fff) 0 16px / 100% calc(100% - 16px) no-repeat;
            mask:
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 16"><path d="M0,8 C8,2 8,2 16,8 C24,14 24,14 32,8 L32,16 L0,16 Z" fill="white"/></svg>') top / 32px 16px repeat-x,
                linear-gradient(#fff, #fff) 0 16px / 100% calc(100% - 16px) no-repeat;
            transform: translateX(-50%);
            box-shadow: 0 0 25px 6px rgba(255, 87, 34, 0.55);
            animation: magmaSurface 1.4s linear infinite;
        }

        @keyframes magmaSurface {
            from {
                -webkit-mask-position: 0 0, 0 16px;
                mask-position: 0 0, 0 16px;
            }
            to {
                -webkit-mask-position: -32px 0, 0 16px;
                mask-position: -32px 0, 0 16px;
            }
        }

        @keyframes magmaWaves {
            from { background-position: 0 0, 0 0; }
            to { background-position: 0 28px, 0 0; }
        }

        /* Cámara magmática en la base */
        .volcano-interior::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0%;
            width: 80%;
            height: 20%;
            background: radial-gradient(circle, #fffa65 0%, #ff3838 60%, #c0392b 85%, transparent 100%);
            border-radius: 50%;
            transform: translateX(-50%);
        }

        .volcano-container:hover .volcano,
        .volcano-container:hover .volcano-details {
            opacity: 0;
        }

        .volcano-container:hover .volcano-interior {
            opacity: 1;
        }

        /* Cráter (Magma interno) */
        .crater {
            position: absolute;
            top: 23%;
            left: 30%;
            width: 40%;
            height: 16px;
            background-color: #222;
            border-radius: 50%;
            overflow: hidden;
            z-index: 2;
        }

        .crater-lava {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fffa65 0%, #ff3838 80%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* Ríos de Lava */
        .lava-river {
            position: absolute;
            top: 25%;
            left: 48%;
            width: 14px;
            height: 0%;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 3px, transparent 3px, transparent 14px),
                linear-gradient(to bottom, #fffa65, #ff3838, #c0392b);
            background-size: 100% 28px, 100% 100%;
            border-radius: 8px;
            box-shadow: 0 0 10px #ff3838;
            opacity: 0;
            transition: height 0.2s ease, opacity 0.2s ease;
            animation: magmaWaves 1s linear infinite;
            z-index: 2;
        }

        /* Gotas de lava: nacen cerca del cráter y caen como línea rígida hasta que
           ambas puntas (cabeza y cola) llegan a la base del volcán (solo en 100%) */
        .lava-stream {
            position: absolute;
            opacity: 0;
            background: linear-gradient(to bottom, #fffa65, #ff3838, #c0392b);
            border-radius: 50% 50% 8px 8px;
            box-shadow: 0 0 10px #ff3838;
            z-index: 2;
        }

        .lava-river-2 {
            position: absolute;
            top: 25%;
            left: 38%;
            width: 10px;
            height: 0%;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 3px, transparent 3px, transparent 14px),
                linear-gradient(to bottom, #fffa65, #e74c3c);
            background-size: 100% 28px, 100% 100%;
            border-radius: 8px;
            box-shadow: 0 0 10px #ff3838;
            opacity: 0;
            transition: height 0.2s ease, opacity 0.2s ease;
            animation: magmaWaves 1s linear infinite;
            z-index: 2;
        }

        /* Casitas repartidas sobre el pasto */
        .houses-container {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            height: 80px; /* margen para que algunas casas suban sobre la franja verde */
            pointer-events: none;
            z-index: 4; /* debajo del volcán (z-index:1): lo que cae detrás queda tapado */
        }

        .house {
            position: absolute;
            width: 45px;
            height: 45px;
            transform-origin: center bottom;
        }

        /* Palmeras en primer plano, sobre las montañas laterales */
        .palm-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 130px;
            pointer-events: none;
            z-index: 5;
        }

        .palm {
            position: absolute;
            bottom: 0;
            width: 55px;
            height: 115px;
        }

        /* Montañas laterales que tapan los bordes del escenario.
           Escalan de forma continua con el ancho de pantalla (270px a 800px de
           viewport, hasta 150px a 450px) en vez de saltar de golpe en un breakpoint,
           y en pantallas chicas se achican para no tapar las casas. */
        .side-mountain {
            position: absolute;
            bottom: 0;
            width: clamp(150px, calc(34.29vw - 4.29px), 270px);
            height: 290px;
            background-color: #241f1c;
            z-index: 4;
            pointer-events: none;
        }

        .side-mountain.left {
            left: -30px;
            height: clamp(100px, calc(11.43vw + 48.57px), 140px);
            clip-path: polygon(0% 22.75%, 23.5% 28%, 70.39% 54.82%, 100% 100%, 0% 100%);
        }

        .side-mountain.right {
            right: -30px;
            height: clamp(100px, calc(54.29vw - 144.29px), 290px);
            clip-path: polygon(0% 100%, 24.93% 83.9%, 55.84% 46.84%, 85.96% 29%, 100% 35.75%, 100% 100%);
        }

        /* Suelo */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background-color: #2d5a27;
            transition: background-color 0.3s ease;
            z-index: 3;
        }

        /* Mar: mismo truco de máscara con forma de ola que el conducto de magma,
           así el borde superior no es una línea recta sino el oleaje real. */
        .ground-sea {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: #2327fa;
            transition: background-color 0.3s ease;
            z-index: 2;
            -webkit-mask:
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 4"><path d="M0,2 C3.5,0.5 3.5,0.5 7,2 C10.5,3.5 10.5,3.5 14,2 L14,4 L0,4 Z" fill="white"/></svg>') top / 14px 4px repeat-x,
                linear-gradient(#fff, #fff) 0 4px / 100% calc(100% - 4px) no-repeat;
            mask:
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 4"><path d="M0,2 C3.5,0.5 3.5,0.5 7,2 C10.5,3.5 10.5,3.5 14,2 L14,4 L0,4 Z" fill="white"/></svg>') top / 14px 4px repeat-x,
                linear-gradient(#fff, #fff) 0 4px / 100% calc(100% - 4px) no-repeat;
            animation: seaSurface 2.4s linear infinite;
        }

        @keyframes seaSurface {
            from {
                -webkit-mask-position: 0 0, 0 4px;
                mask-position: 0 0, 0 4px;
            }
            to {
                -webkit-mask-position: 14px 0, 0 4px;
                mask-position: 14px 0, 0 4px;
            }
        }

        .ground-sea::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, #dddb96 0%, #e2d770 60%, #dfd767 85%, transparent 100%);
            border-radius: 50%;
            transform: translateX(-50%); 
        }

        /* Dientes de sierra que simulan pasto en el borde superior del suelo */
        .ground::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: inherit;
            transition: background-color 0.3s ease;
            clip-path: polygon(0% 100%, 2.5% 0%, 5% 100%, 7.5% 0%, 10% 100%, 12.5% 0%, 15% 100%, 17.5% 0%, 20% 100%, 22.5% 0%, 25% 100%, 27.5% 0%, 30% 100%, 32.5% 0%, 35% 100%, 37.5% 0%, 40% 100%, 42.5% 0%, 45% 100%, 47.5% 0%, 50% 100%, 52.5% 0%, 55% 100%, 57.5% 0%, 60% 100%, 62.5% 0%, 65% 100%, 67.5% 0%, 70% 100%, 72.5% 0%, 75% 100%, 77.5% 0%, 80% 100%, 82.5% 0%, 85% 100%, 87.5% 0%, 90% 100%, 92.5% 0%, 95% 100%, 97.5% 0%, 100% 100%);
        }

        /* Panel de Estado y Controles */
        .control-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .status-header h2 {
            font-size: clamp(1.05rem, 4vw, 1.4rem);
        }

        .phase-badge {
            background-color: #0984e3;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: background-color 0.3s;
        }

        .status-description {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 20px;
            min-height: 40px;
        }

        /* Botones "¿Qué tipo de volcán eres?" */
        .type-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }

        .type-btn {
            flex: 1;
            min-width: 0;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #eee;
            font-weight: bold;
            font-size: clamp(0.75rem, 2.6vw, 0.9rem);
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }

        .type-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .type-btn.active {
            border-color: transparent;
        }

        .type-btn[data-type="inactivo"].active { background: #2ecc71; color: #06210f; }
        .type-btn[data-type="activo"].active { background: #e67e22; color: #2a1400; }
        .type-btn[data-type="erupcion"].active { background: #e74c3c; color: #2a0a06; }

        /* Estilo del Deslizador (Slider) */
        .slider-container {
            position: relative;
            margin: 20px 0 10px 0;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 15px;
            border-radius: 10px;
            background: linear-gradient(to right, #2ecc71, #f1c40f, #e67e22, #e74c3c);
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 3px solid #333;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .ticks {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            font-size: clamp(0.65rem, 2.2vw, 0.8rem);
            color: #aaa;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Control de hora simulada, solo para pruebas */
        .debug-time {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            color: #999;
        }

        .debug-time input[type="time"] {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #eee;
            padding: 4px 8px;
            font-size: 0.85rem;
            color-scheme: dark;
        }

        /* Animaciones dinámicas */
        .smoke-particle {
            position: absolute;
            background-color: rgba(200, 200, 200, 0.6);
            border-radius: 50%;
            animation: rise 2.5s infinite linear;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-220px) scale(3.5);
                opacity: 0;
            }
        }

        .lava-particle {
            position: absolute;
            background-color: #fffa65;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3838;
            animation-name: explode;
            animation-timing-function: ease-in;
            animation-fill-mode: forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            55% {
                transform: translate(calc(var(--dx) * 0.6), var(--peak)) scale(0.9);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.15);
                opacity: 0;
            }
        }

        /* Efecto Shake / Temblores */
        .shake-light {
            animation: shake 0.3s infinite;
        }

        .shake-heavy {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translateX(-50%) translate(0, 0); }
            25% { transform: translateX(-50%) translate(-2px, 1px); }
            50% { transform: translateX(-50%) translate(2px, -1px); }
            75% { transform: translateX(-50%) translate(-1px, -2px); }
            100% { transform: translateX(-50%) translate(1px, 1px); }
        }

        /* Temblor de las casas: usa la propiedad `translate` (no `transform`) para no
           pisar el transform inline (escala/colapso) que ya les pone updateHouses(). */
        .house.shake-light {
            animation: houseShake 0.3s infinite;
        }

        .house.shake-heavy {
            animation: houseShake 0.1s infinite;
        }

        @keyframes houseShake {
            0% { translate: 0 0; }
            25% { translate: -0.6px 0.3px; }
            50% { translate: 0.6px -0.3px; }
            75% { translate: -0.3px -0.6px; }
            100% { translate: 0.3px 0.3px; }
        }

        /* Temblor del mar: todavía más sutil que el de las casas. */
        .ground-sea.shake-light {
            animation: seaSurface 2.4s linear infinite, seaShake 0.3s infinite;
        }

        .ground-sea.shake-heavy {
            animation: seaSurface 2.4s linear infinite, seaShake 0.1s infinite;
        }

        @keyframes seaShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-0.25px, 0.12px); }
            50% { transform: translate(0.25px, -0.12px); }
            75% { transform: translate(-0.12px, -0.25px); }
            100% { transform: translate(0.12px, 0.12px); }
        }

        /* Control de volumen del SFX de fondo (ocean.aac) */
        .audio-control {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 10;
        }

        .audio-control button {
            background: none;
            border: none;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        .audio-control input[type="range"] {
            width: 70px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.3);
        }

        .audio-control input[type="range"]::-webkit-slider-thumb {
            width: 12px;
            height: 12px;
            border: 2px solid #333;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>Volcán del Estrés</h1>

    <!-- Escenario Visual -->
    <div class="stage" id="stage">
        <div class="sun" id="sun"></div>
        <div class="cloud-container" id="cloudContainer"></div>
        <div class="particle-container" id="particleContainer"></div>
        
        <div class="volcano-container" id="volcanoContainer">
            <div class="volcano"></div>
            <div class="volcano-details"></div>
            <div class="volcano-interior"></div>
            <div class="crater">
                <div class="crater-lava" id="craterLava"></div>
            </div>
            <div class="lava-river" id="lavaRiver1"></div>
            <div class="lava-river-2" id="lavaRiver2"></div>
        </div>

        <div class="houses-container" id="housesContainer"></div>
        <div class="palm-container" id="palmContainer"></div>
        <div class="side-mountain left"></div>
        <div class="side-mountain right"></div>
        <div class="ground" id="ground"></div>
        <div class="ground-sea" id="ground-sea"></div>

        <div class="audio-control" id="audioControl">
            <button type="button" id="audioToggle" onclick="toggleOceanAudio()" aria-label="Silenciar o reactivar todos los sonidos">🔇</button>
            <!-- <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="setOceanVolume(this.value)" aria-label="Volumen del sonido del mar"> -->
        </div>
    </div>

    <audio id="oceanAudio" src="media/sea.aac" preload="auto"></audio>
    <audio id="erupcionAudio" src="media/eruption.aac" preload="auto"></audio>
    <audio id="shakingAudio" src="media/shaking.m4a" preload="auto"></audio>
    <audio id="initialFireAudio" src="media/initial_fire.m4a" preload="auto"></audio>
    <audio id="fireWhooshAudio" src="media/fire_whoosh.aac" preload="auto"></audio>
    <audio id="lavaAudio" src="media/lava.m4a" preload="auto"></audio>

    <!-- Controladores e Información -->
    <div class="control-panel">
        <div class="status-header">
            <h2 id="activityLevel">¿Qué tipo de volcán eres?: 0%</h2>
            <span class="phase-badge" id="phaseBadge">1. Volcán Inactivo</span>
        </div>
        
        <p class="status-description" id="phaseDesc">
            El volcán se encuentra en reposo absoluto. El cielo está despejado y la naturaleza a su alrededor está a salvo.
        </p>

        <div class="type-buttons" id="typeButtons">
            <button type="button" class="type-btn" data-type="inactivo" onclick="setVolcanoType(0)">Inactivo</button>
            <button type="button" class="type-btn" data-type="activo" onclick="setVolcanoType(50)">Activo</button>
            <button type="button" class="type-btn" data-type="erupcion" onclick="setVolcanoType(100)">Erupción</button>
        </div>

        <div class="slider-container">
            <input type="range" id="volcanoSlider" min="0" max="100" value="0" oninput="updateVolcano(this.value)">
            <div class="ticks">
                <span>0% (Inactivo)</span>
                <span>50% (Activo - Alta Presión)</span>
                <span>100% (Erupción)</span>
            </div>
        </div>

        <!-- <div class="debug-time">
            <label for="debugTimeInput">🕐 Probar hora (cielo/sol, solo para pruebas)</label>
            <input type="time" id="debugTimeInput" oninput="setDebugTime(this.value)">
        </div> -->
    </div>

    <script>
        const stage = document.getElementById('stage');
        const sun = document.getElementById('sun');
        const ground = document.getElementById('ground');
        const groundSea = document.getElementById('ground-sea');
        const volcanoContainer = document.getElementById('volcanoContainer');
        const craterLava = document.getElementById('craterLava');
        const lavaRiver1 = document.getElementById('lavaRiver1');
        const lavaRiver2 = document.getElementById('lavaRiver2');
        const particleContainer = document.getElementById('particleContainer');
        const cloudContainer = document.getElementById('cloudContainer');
        const housesContainer = document.getElementById('housesContainer');
        const palmContainer = document.getElementById('palmContainer');
        
        const activityLevel = document.getElementById('activityLevel');
        const phaseBadge = document.getElementById('phaseBadge');
        const phaseDesc = document.getElementById('phaseDesc');
        const volcanoSlider = document.getElementById('volcanoSlider');
        const typeButtons = document.getElementById('typeButtons');
        const oceanAudio = document.getElementById('oceanAudio');
        const audioToggle = document.getElementById('audioToggle');
        const erupcionAudio = document.getElementById('erupcionAudio');
        const shakingAudio = document.getElementById('shakingAudio');
        const fireWhooshAudio = document.getElementById('fireWhooshAudio');
        const lavaAudio = document.getElementById('lavaAudio');
        //const volumeSlider = document.getElementById('volumeSlider');

        let particleInterval = null;
        let lastVal = 0; // último valor del slider, para detectar el cruce hacia 50%

        // Los .aac quedan con ~0.5s de silencio al principio Y al final (típico del
        // encoder priming/padding de AAC), así que el `loop` nativo del navegador
        // reproduce ese hueco en cada vuelta. Se maneja el reinicio a mano: se salta
        // el silencio inicial al arrancar/reiniciar, y se relanza un poco ANTES de
        // llegar al silencio final, para que el corte no se escuche.
        function setupSeamlessLoop(audioEl, leadSilence = 0.5, trailSilence = 0.5) {
            audioEl.loop = false;

            function restart() {
                audioEl.currentTime = leadSilence;
                audioEl.play().catch(() => {});
            }

            audioEl.addEventListener('loadedmetadata', () => {
                if (audioEl.currentTime < leadSilence) audioEl.currentTime = leadSilence;
            });

            audioEl.addEventListener('timeupdate', () => {
                if (audioEl.duration && audioEl.currentTime >= audioEl.duration - trailSilence) {
                    restart();
                }
            });

            audioEl.addEventListener('ended', restart); // red de seguridad
        }

        // Baja el volumen de audioEl a 0 a lo largo de `duration` ms y llama a
        // onComplete (normalmente para pausar y dejarlo listo para la próxima vez).
        // Reutilizado por cualquier SFX que necesite un fade-out.
        function fadeOutVolume(audioEl, duration, onComplete) {
            clearInterval(audioEl._fadeInterval);
            const steps = 16;
            const stepTime = duration / steps;
            const startVolume = audioEl.volume;
            let step = 0;
            audioEl._fadeInterval = setInterval(() => {
                step++;
                audioEl.volume = Math.max(0, startVolume * (1 - step / steps));
                if (step >= steps) {
                    clearInterval(audioEl._fadeInterval);
                    if (onComplete) onComplete(startVolume);
                }
            }, stepTime);
        }

        // SFX que disparan un solo disparo al cruzar hacia 50%+, con fade-out corto
        // si el valor cae de golpe por debajo de 50 mientras todavía están sonando.
        // startOffset salta el silencio inicial del archivo (ver setupSeamlessLoop).
        function createThresholdSFX(audioEl, volume = 1, startOffset = 0) {
            function play() {
                clearInterval(audioEl._fadeInterval);
                audioEl.volume = volume;
                audioEl.currentTime = startOffset;
                audioEl.play().catch(() => {});
            }

            function fadeOut(duration = 800) {
                if (audioEl.paused) return;
                fadeOutVolume(audioEl, duration, (startVolume) => {
                    audioEl.pause();
                    audioEl.currentTime = startOffset;
                    audioEl.volume = startVolume; // listo para la próxima vez
                });
            }

            return { play, fadeOut };
        }

        // Calibrador de volumen de eruption.aac: cambiar este número (0 a 1) a mano.
        const ERUPCION_VOLUME = 0.4;
        const erupcionSFX = createThresholdSFX(erupcionAudio, ERUPCION_VOLUME);
        const shakingSFX = createThresholdSFX(shakingAudio, 1, 0.5);
        const fireWhooshSFX = createThresholdSFX(fireWhooshAudio, 1, 0.39); // salta el silencio inicial del archivo
        const lavaSFX = createThresholdSFX(lavaAudio, 1, 0.5); // salta el silencio inicial del archivo
        setupSeamlessLoop(shakingAudio);
        setupSeamlessLoop(oceanAudio);

        // initial_fire: suena mientras el estrés está en (15%, 50%].
        // - Entrando desde abajo (<=15): arranca desde el principio (intro) y al
        //   terminar hace loop desde FIRE_LOOP_POINT (6.67s) para siempre.
        // - Entrando desde arriba (>50, retrocediendo): arranca directo en el loop,
        //   sin repetir la intro.
        // - Saliendo por abajo de 15: fade corto (800ms) y se detiene.
        // - Saliendo por arriba de 50: fade de 2 segundos y se detiene (la erupción
        //   y el temblor ya arrancan justo en ese cruce).
        const initialFireAudio = document.getElementById('initialFireAudio');
        const FIRE_LOOP_POINT = 6.67;
        const fireVolume = 0.4;
        let initialFireStartedAt = 0;

        function playInitialFire(fromLoopPoint) {
            clearInterval(initialFireAudio._fadeInterval);
            initialFireAudio.volume = fireVolume;
            initialFireAudio.currentTime = fromLoopPoint ? FIRE_LOOP_POINT : 0;
            initialFireAudio.play().catch(() => {});
            initialFireStartedAt = Date.now();
        }

        function stopInitialFire(duration) {
            if (initialFireAudio.paused) return;
            fadeOutVolume(initialFireAudio, duration, (startVolume) => {
                initialFireAudio.pause();
                initialFireAudio.currentTime = 0;
                initialFireAudio.volume = startVolume;
            });
        }

        // Si val supera 50% cuando initial_fire lleva sonando menos de 1 segundo (se
        // pasó rápido por la fase 15%-50%), no tiene sentido el fade largo de 2s:
        // se cancela con uno corto en su lugar.
        function stopInitialFireOnEruption() {
            const playedFor = Date.now() - initialFireStartedAt;
            stopInitialFire(playedFor < 1000 ? 800 : 2000);
        }

        // Una vez arrancado (desde 0 o desde el loop point), al llegar al final
        // siempre vuelve a sonar en bucle desde FIRE_LOOP_POINT.
        initialFireAudio.addEventListener('ended', () => {
            initialFireAudio.currentTime = FIRE_LOOP_POINT;
            initialFireAudio.play().catch(() => {});
        });

        // SFX de fondo (oleaje cíclico). Arranca en pausa: los navegadores bloquean el
        // autoplay con sonido hasta que haya un gesto del usuario, así que se reproduce
        // recién cuando se toca el botón de mute/play.
        oceanAudio.volume = 0.05;

        // El botón es un mute maestro: silencia/reactiva TODOS los sonidos (el mar de
        // fondo y cualquier SFX que esté sonando en ese momento), no solo el mar.
        // Arranca muteado (el ícono inicial 🔇 lo refleja); el primer clic activa el sonido.
        let audioMuted = true;
        const allAudios = [oceanAudio, erupcionAudio, shakingAudio, initialFireAudio, fireWhooshAudio, lavaAudio];
        allAudios.forEach(audio => { audio.muted = true; });

        function toggleOceanAudio() {
            audioMuted = !audioMuted;
            for (const audio of allAudios) {
                audio.muted = audioMuted;
            }
            audioToggle.textContent = audioMuted ? '🔇' : '🔊';

            // El mar arranca recién con el primer gesto del usuario (política de
            // autoplay); este clic cuenta como ese gesto.
            if (!audioMuted && oceanAudio.paused) {
                oceanAudio.play().catch(() => {});
            }
        }

        // Hora usada para el cielo de la fase de reposo (0%-15%) y la posición del sol.
        // Arranca en la hora real al abrir el archivo; el campo de pruebas la pisa.
        let simulatedTime = new Date();

        function skyByHour(hour) {
            if (hour < 5) return 'linear-gradient(to bottom, #05070f 0%, #131b3a 100%)'; // madrugada
            if (hour < 7) return 'linear-gradient(to bottom, #ff9a76 0%, #f6c667 55%, #87b8e8 100%)'; // amanecer
            if (hour < 17) return '#74b9ff'; // día
            if (hour < 19) return 'linear-gradient(to bottom, #2c3e50 0%, #e17055 60%, #fdcb6e 100%)'; // atardecer
            return 'linear-gradient(to bottom, #05070f 0%, #0f1a3a 100%)'; // noche
        }

        // Recorrido del sol solo entre el amanecer (6:00) y el atardecer (18:00): arco
        // semicircular grande, pegado al horizonte en amanecer/atardecer y asomando por
        // encima del escenario al mediodía. Fuera de ese rango queda oculto (de noche
        // no cruza la pantalla ni hay salto al pasar de 23:59 a 00:00).
        const SUNRISE_MIN = 6 * 60;
        const SUNSET_MIN = 18 * 60;

        function sunPositionByHour(hour, minutes) {
            const totalMinutes = hour * 60 + minutes;
            if (totalMinutes < SUNRISE_MIN || totalMinutes > SUNSET_MIN) {
                return { left: 50, top: 90, visible: false };
            }

            const t = (totalMinutes - SUNRISE_MIN) / (SUNSET_MIN - SUNRISE_MIN); // 0 a 1 entre amanecer y atardecer
            const xn = t * 2 - 1; // -1 a 1
            const arcHeight = Math.sqrt(Math.max(0, 1 - xn * xn)); // 0 en los bordes, 1 al centro
            return { left: t * 100, top: 90 - arcHeight * 100, visible: true };
        }

        function applySunPosition() {
            const pos = sunPositionByHour(simulatedTime.getHours(), simulatedTime.getMinutes());
            sun.style.right = 'auto';
            sun.style.left = `${pos.left}%`;
            sun.style.top = `${pos.top}%`;
            sun.style.opacity = pos.visible ? '1' : '0';
        }

        // Campo de pruebas: pisa la hora simulada con un <input type="time"> y
        // refresca el cielo (si estamos en la fase de reposo) y la posición del sol.
        function setDebugTime(value) {
            if (!value) return;
            const [hours, minutes] = value.split(':').map(Number);
            simulatedTime = new Date();
            simulatedTime.setHours(hours, minutes, 0, 0);
            applySunPosition();
            updateVolcano(volcanoSlider.value);
        }

        // Botones de acceso rápido a cada tipo de volcán: mueven el slider y disparan
        // la misma actualización que arrastrarlo a mano.
        function setVolcanoType(val) {
            volcanoSlider.value = val;
            updateVolcano(val);
        }

        // Resalta el botón cuyo rango coincide con el valor actual del slider,
        // usando los mismos umbrales de fase que updateVolcano.
        function updateTypeButtons(val) {
            const type = val < 50 ? 'inactivo' : val <= 75 ? 'activo' : 'erupcion';
            for (const btn of typeButtons.children) {
                btn.classList.toggle('active', btn.dataset.type === type);
            }
        }

        function updateVolcano(val) {
            val = parseInt(val);
            activityLevel.innerText = `¿Qué tipo de volcán eres?: ${val}%`;

            // SFX de erupción y de temblor: suenan una sola vez al AVANZAR de <50 hasta
            // 50 o más. Si se retrocede desde 50+ hacia abajo, no vuelven a sonar desde
            // el principio: lo que sonaba se apaga con un fade corto (no tiene sentido
            // seguir reproduciendo el audio de una erupción que se canceló).
            if (lastVal < 50 && val >= 50) {
                erupcionSFX.play();
                shakingSFX.play();
            } else if (lastVal >= 50 && val < 50) {
                erupcionSFX.fadeOut();
                shakingSFX.fadeOut();
            }

            // lava: mismas reglas, pero arranca a partir de 75% y su fade es de 1s.
            if (lastVal < 75 && val >= 75) {
                lavaSFX.play();
            } else if (lastVal >= 75 && val < 75) {
                lavaSFX.fadeOut(1000);
            }

            // initial_fire: activo mientras 15 < val <= 50.
            if (lastVal <= 15 && val > 15 && val <= 50) {
                playInitialFire(false); // entra desde abajo: intro completa primero
            } else if (lastVal > 50 && val > 15 && val <= 50) {
                playInitialFire(true); // entra desde arriba: directo al loop
            } else if (lastVal > 15 && lastVal <= 50 && val <= 15) {
                stopInitialFire(800); // sale por abajo: fade corto
            } else if (lastVal > 15 && lastVal <= 50 && val > 50) {
                stopInitialFireOnEruption(); // sale por arriba: 2s, o corto si llevaba <1s sonando
            }

            // fire_whoosh: un solo disparo al BAJAR de cualquier valor por arriba de 15
            // hasta 15 o menos (sin importar si venía de la zona media o de la erupción).
            if (lastVal > 15 && val <= 15) {
                fireWhooshSFX.play();
            }

            lastVal = val;

            // Limpieza de intervalos y efectos de temblor
            if (particleInterval) clearInterval(particleInterval);
            volcanoContainer.classList.remove('shake-light', 'shake-heavy');
            groundSea.classList.toggle('shake-light', val >= 50 && val <= 75);
            groundSea.classList.toggle('shake-heavy', val > 75);

            // Lógica Progresiva por Porcentajes
            
            // --- FASE 1: INACTIVO (0% - 15%) ---
            if (val <= 15) {
                phaseBadge.innerText = "1. Volcán Inactivo";
                phaseBadge.style.backgroundColor = "#2ecc71";
                phaseDesc.innerText = "Se me dificulta mucho expresar mis emociones. Cuando estoy en situaciones de estrés no hablo con nadie, me aparto de los demás y me aíslo de lo que me rodea. No he logrado encontrar una manera de expresar mis sentimientos.";
                
                stage.style.background = skyByHour(simulatedTime.getHours());
                sun.style.backgroundColor = "#ffd700";
                sun.style.boxShadow = "0 0 20px #ffd700";
                ground.style.backgroundColor = "#2d5a27";

                craterLava.style.opacity = "0";
                lavaRiver1.style.height = "0%";
                lavaRiver1.style.opacity = "0";
                lavaRiver2.style.height = "0%";
                lavaRiver2.style.opacity = "0";
            } 
            
            // --- FASE INTERMEDIA: ACTIVIDAD INICIAL / AUMENTO DE PRESIÓN (16% - 50%) ---
            else if (val > 15 && val < 50) {
                phaseBadge.innerText = "1. Volcán Inactivo";
                phaseBadge.style.backgroundColor = "#2ecc71";
                phaseDesc.innerText = "Se me dificulta mucho expresar mis emociones. Cuando estoy en situaciones de estrés no hablo con nadie, me aparto de los demás y me aíslo de lo que me rodea. No he logrado encontrar una manera de expresar mis sentimientos.";
                
                // Transición del cielo a un tono más oscuro según sube el valor
                let skyFactor = (val - 15) / 35;
                stage.style.background = `linear-gradient(to bottom, #4a69bd 0%, #1e3799 100%)`;
                ground.style.backgroundColor = "#23471e";

                craterLava.style.opacity = (val / 50).toFixed(2);
                lavaRiver1.style.height = "0%";
                lavaRiver2.style.height = "0%";

                // Humo suave progresivo
                let delay = 600 - (val * 8);
                particleInterval = setInterval(() => {
                    createSmoke(false, val);
                }, Math.max(delay, 150));
            } 

            // --- FASE INTERMEDIA: ACTIVIDAD ALTA / PRE-ERUPCIÓN (51% - 75%) ---
            else if (val >= 50 && val <= 75) {
                phaseBadge.innerText = "2. Volcán Activo (Alta Presión)";
                phaseBadge.style.backgroundColor = "#e67e22";
                phaseDesc.innerText = "Logro expresar mis emociones constantemente. Aunque existen situaciones que me producen estrés he logrado autoconocerme y controlar mi reacción para así no afectar a las demás personas. Si llego a afectar a alguien busco la manera de solucionarlo.";
                
                stage.style.background = "linear-gradient(to bottom, #2c3e50 0%, #8e44ad 100%)";
                sun.style.backgroundColor = "#e74c3c";
                sun.style.boxShadow = "0 0 25px #e74c3c";
                ground.style.backgroundColor = "#3e423a";

                craterLava.style.opacity = "1";
                
                // Desborde de lava controlado según porcentaje
                let riverHeight = ((val - 50) / 25) * 50;
                lavaRiver1.style.opacity = "1";
                lavaRiver1.style.height = `${riverHeight}%`;
                lavaRiver2.style.opacity = "1";
                lavaRiver2.style.height = `${riverHeight * 0.7}%`;

                volcanoContainer.classList.add('shake-light');

                // Humo más oscuro y pequeñas chispas de lava
                particleInterval = setInterval(() => {
                    createSmoke(true, val);
                    if (Math.random() > 0.4) createLavaParticle(val);
                }, 120);
            } 

            // --- FASE 3: ERUPCIÓN MÁXIMA (76% - 100%) ---
            else {
                phaseBadge.innerText = "3. ¡ERUPCIÓN VIOLENTA!";
                phaseBadge.style.backgroundColor = "#e74c3c";
                phaseDesc.innerText = "Cuando estoy en situaciones de estrés no logro controlar mis emociones. En estas situaciones he llegado a agredir física y/o verbalmente a otras personas o a mí mismo/a. Se me dificulta pedir perdón o reparar el daño causado.";
                
                stage.style.background = "linear-gradient(to bottom, #111 0%, #c0392b 100%)";
                sun.style.backgroundColor = "#ff7675";
                sun.style.boxShadow = "0 0 40px #ff7675";
                ground.style.backgroundColor = "#2d3436"; // Suelo cubierto de ceniza

                craterLava.style.opacity = "1";
                
                // Rios de lava completos
                let lavaProgress = 50 + (((val - 75) / 25) * 40);
                lavaRiver1.style.opacity = "1";
                lavaRiver1.style.height = `${lavaProgress}%`;
                lavaRiver2.style.opacity = "1";
                lavaRiver2.style.height = `${lavaProgress * 0.8}%`;

                volcanoContainer.classList.add('shake-heavy');

                // Explosiones masivas de humo y proyectiles de lava
                particleInterval = setInterval(() => {
                    createSmoke(true, val);
                    createLavaParticle(val);
                    createLavaParticle(val);
                    // A partir del 100%, brotan trazos extra de lava del volcán
                    if (val >= 100 && Math.random() > 0.8) createLavaStream();
                }, 60);
            }

            updateHouses(val);
            updateClouds(val);
            updateConduit(val);
            updateTypeButtons(val);
        }

        // Sube el nivel de magma del conducto interior de 25% a 78% de forma progresiva
        // entre 0% y 50% de presión; de ahí en adelante se mantiene en su punto máximo.
        function updateConduit(val) {
            const t = Math.min(val, 50) / 50;
            const height = 25 + t * (78 - 25);
            volcanoContainer.style.setProperty('--conduit-height', `${height}%`);
        }

        // Oscurece las nubes entre 50%-75% (ceniza en el ambiente); de ahí en
        // adelante se quedan en su punto más oscuro.
        function updateClouds(val) {
            const t = Math.min(Math.max((val - 50) / 25, 0), 1);
            const brightness = 1 - t * 0.8;
            cloudContainer.style.filter = t > 0 ? `brightness(${brightness.toFixed(2)})` : '';
        }

        // Destruye las casas progresivamente entre 70%-85%; a partir de ahí quedan
        // como restos negros y planos (ceniza/escombros calcinados).
        function updateHouses(val) {
            for (const house of housesContainer.children) {
                // Mismo temblor que el volcán (misma cadencia), pero mucho más suave
                // para que las casas vibren sin competir con su propia animación de colapso.
                house.classList.toggle('shake-light', val >= 50 && val <= 75);
                house.classList.toggle('shake-heavy', val > 75);

                if (val <= 70) {
                    house.style.filter = '';
                    house.style.opacity = '1';
                    house.style.transform = house._baseTransform;
                    continue;
                }
                const t = Math.min(Math.max((val - house._collapseStart) / (85 - house._collapseStart), 0), 1);
                house.style.filter = `brightness(${(1 - t).toFixed(2)}) saturate(${(1 - t).toFixed(2)})`;
                house.style.opacity = `${(1 - t * 0.25).toFixed(2)}`;
                house.style.transform = `${house._baseTransform} scaleY(${(1 - t * 0.65).toFixed(2)}) rotate(${(t * 14 - 6).toFixed(1)}deg)`;
            }
        }

        // Posición real del cráter dentro del stage (en vez de un offset fijo en px
        // calibrado para el alto de escritorio, que ya no coincide en pantallas chicas
        // donde el stage es más bajo).
        function craterOrigin() {
            const stageRect = stage.getBoundingClientRect();
            const craterRect = document.querySelector('.crater').getBoundingClientRect();
            return {
                x: craterRect.left - stageRect.left + craterRect.width / 2,
                y: craterRect.top - stageRect.top + craterRect.height / 2
            };
        }

        // Crear partícula(s) de humo — dos bocanadas por llamada para más densidad
        function createSmoke(isDark, val) {
            const origin = craterOrigin();
            for (let p = 0; p < 2; p++) {
                const smoke = document.createElement('div');
                smoke.classList.add('smoke-particle');

                const size = Math.random() * (val / 2) + 25;
                smoke.style.width = `${size}px`;
                smoke.style.height = `${size}px`;

                smoke.style.left = `${origin.x + Math.random() * 50 - 25}px`;
                smoke.style.top = `${origin.y}px`;

                if (isDark) {
                    smoke.style.backgroundColor = `rgba(50, 50, 50, ${Math.min(val / 100, 0.9)})`;
                } else {
                    smoke.style.backgroundColor = 'rgba(220, 220, 220, 0.75)';
                }

                particleContainer.appendChild(smoke);

                setTimeout(() => {
                    smoke.remove();
                }, 2500);
            }
        }

        // Crear fragmentos de lava proyectados
        function createLavaParticle(val) {
            const lava = document.createElement('div');
            lava.classList.add('lava-particle');

            const size = Math.random() * 8 + 4;
            lava.style.width = `${size}px`;
            lava.style.height = `${size}px`;

            // Punto de salida variable dentro del cráter, no siempre el mismo pixel
            const origin = craterOrigin();
            const spawnOffset = (Math.random() - 0.5) * 24;
            lava.style.left = `${origin.x + spawnOffset}px`;
            lava.style.top = `${origin.y}px`;

            // Cada partícula tiene su propia fuerza, arco y caída: nunca la misma trayectoria
            const force = (val / 100) * 280;
            const dx = (Math.random() - 0.5) * force * (0.6 + Math.random() * 0.8);
            const peak = -(Math.random() * (force * 0.6) + 30);
            const fall = Math.random() * (force * 0.6) + 60;
            const duration = 0.9 + Math.random() * 0.9;

            lava.style.setProperty('--dx', `${dx}px`);
            lava.style.setProperty('--peak', `${peak}px`);
            lava.style.setProperty('--dy', `${peak + fall}px`);
            lava.style.animationDuration = `${duration}s`;

            particleContainer.appendChild(lava);

            setTimeout(() => {
                lava.remove();
            }, duration * 1000);
        }

        // Nubes procedurales: nacen a la izquierda y viajan a la derecha,
        // sin importar la fase del volcán (intervalo propio, nunca se limpia)
        function spawnCloud(startX) {
            const cloud = document.createElement('div');
            cloud.classList.add('cloud');

            const width = Math.random() * 70 + 70;
            const height = width * 0.4;
            cloud.style.width = `${width}px`;
            cloud.style.height = `${height}px`;
            cloud.style.top = `${Math.random() * 45 + 5}%`;
            cloud.style.opacity = (Math.random() * 0.3 + 0.6).toFixed(2);

            const containerWidth = stage.clientWidth;
            const left = startX !== undefined ? startX : -width;
            cloud.style.left = `${left}px`;

            const speed = 22 + Math.random() * 15; // px/s aprox
            const distance = containerWidth - left + width;
            const duration = distance / speed;
            cloud.style.setProperty('--dist', `${distance}px`);
            cloud.style.animationDuration = `${duration}s`;

            cloudContainer.appendChild(cloud);
            setTimeout(() => cloud.remove(), duration * 1000);
        }

        // Poblar el cielo al cargar para que no empiece vacío
        [0.1, 0.4, 0.7].forEach(f => spawnCloud(stage.clientWidth * f));
        setInterval(() => spawnCloud(), 4000 + Math.random() * 3000);

        // Gota de lava que nace junto al cráter y cae como línea rígida: se traslada
        // entera (cabeza y cola) hasta que la punta trasera también llega a la base.
        function createLavaStream() {
            const stream = document.createElement('div');
            stream.classList.add('lava-stream');

            const left = 30 + Math.random() * 40; // % ceñido a la boca real del cráter (30%-70%)
            const width = Math.random() * 6 + 4;
            stream.style.left = `${left}%`;
            stream.style.width = `${width}px`;

            const containerHeight = volcanoContainer.clientHeight;
            const startTop = containerHeight * 0.25; // altura del cráter
            const dropLength = 30 + Math.random() * 35; // "gota grande": largo de la línea
            stream.style.top = `${startTop}px`;
            stream.style.height = `${dropLength}px`;

            const travel = containerHeight - startTop; // hasta que la punta trasera toque la base
            const duration = 1 + Math.random() * 1.2;
            stream.style.transition = `transform ${duration}s linear, opacity ${duration}s ease`;

            volcanoContainer.appendChild(stream);
            requestAnimationFrame(() => {
                stream.style.opacity = '1';
                stream.style.transform = `translateY(${travel}px)`;
            });

            setTimeout(() => { stream.style.opacity = '0'; }, duration * 700);
            setTimeout(() => stream.remove(), duration * 1000 + 400);
        }

        // Casita estilo icono plano (techo, chimenea, puerta en arco, 2 ventanas, base)
        function houseSVG() {
            return `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <rect x="66" y="6" width="11" height="17" fill="#8e2f27"/>
                <path d="M8,50 L50,12 L92,50" fill="none" stroke="#d9524a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="15" y="45" width="70" height="47" fill="#3bb6ad"/>
                <rect x="22" y="55" width="13" height="11" fill="#1f2d3d"/>
                <rect x="20" y="66" width="17" height="2.5" fill="#16212e"/>
                <rect x="65" y="55" width="13" height="11" fill="#1f2d3d"/>
                <rect x="63" y="66" width="17" height="2.5" fill="#16212e"/>
                <path d="M43,92 v-19 a7,7 0 0 1 14,0 v19 z" fill="#1f2d3d"/>
                <circle cx="45.5" cy="79" r="1.6" fill="#0c1319"/>
                <rect x="5" y="90" width="90" height="8" fill="#16212e"/>
            </svg>`;
        }

        // Reparte varias casas por toda la franja verde sin que se superpongan;
        // las que caen detrás del volcán quedan tapadas por su silueta (z-index)
        function layoutHouses() {
            housesContainer.innerHTML = '';
            const stageWidth = stage.clientWidth;
            const houseWidth = 60;
            const minGap = 4;
            const margin = 10;
            const slot = houseWidth + minGap;
            const count = Math.floor((stageWidth - margin * 2 + minGap) / slot);

            for (let i = 0; i < count; i++) {
                const slotStart = margin + i * slot;
                const jitterX = Math.random() * (minGap * 0.7);
                // profundidad al azar: más cerca (abajo, hundida en el pasto, más grande)
                // o más lejos (arriba, sobre la franja verde, más pequeña) — rompe el alineado
                const closeness = Math.random();
                const bottom = 20 - closeness * 38;
                const scale = 0.8 + closeness * 0.35;

                const house = document.createElement('div');
                house.classList.add('house');
                house.style.left = `${slotStart + jitterX}px`;
                house.style.bottom = `${bottom}px`;
                house.style.transformOrigin = 'center bottom';
                house._baseTransform = `scale(${scale.toFixed(2)})`;
                house.style.transform = house._baseTransform;
                house._collapseStart = 70 + Math.random() * 8; // 70%-78%: arranque escalonado de cada casa
                house.innerHTML = houseSVG();
                housesContainer.appendChild(house);
            }
        }

        // Palmera estilizada: tronco curvo + hojas en abanico (una sola forma rotada)
        function palmSVG() {
            const leaf = 'M0,0 C15,-8 30,-2 38,10 C25,8 12,6 0,0 Z';
            const angles = [-45, -18, 8, 34, 60];
            const colors = ['#2e7d4f', '#3a9c63', '#2e7d4f', '#3a9c63', '#2e7d4f'];
            const fronds = angles.map((a, i) =>
                `<path d="${leaf}" fill="${colors[i]}" transform="rotate(${a})"/>`
            ).join('');
            return `<svg viewBox="0 0 60 120" width="100%" height="100%">
                <path d="M30,120 C24,90 34,60 27,22" stroke="#8a5a34" stroke-width="6" fill="none" stroke-linecap="round"/>
                <g transform="translate(27,22)">${fronds}</g>
            </svg>`;
        }

        // Un par de palmeras cerca de cada borde, delante de las montañas laterales
        function layoutPalms() {
            palmContainer.innerHTML = '';
            const stageWidth = stage.clientWidth;
            const spots = [18, 55, stageWidth - 45, stageWidth - 85];
            spots.forEach(x => {
                const palm = document.createElement('div');
                palm.classList.add('palm');
                palm.style.left = `${x}px`;
                const scale = 0.85 + Math.random() * 0.3;
                palm.style.transform = `scale(${scale.toFixed(2)})`;
                palm.style.transformOrigin = 'center bottom';
                // palm.innerHTML = palmSVG();
                palmContainer.appendChild(palm);
            });
        }

        layoutHouses();
        layoutPalms();

        // En móvil, hacer scroll muestra/oculta la barra de direcciones y dispara
        // 'resize' aunque el ancho no haya cambiado en absoluto. Reconstruir las casas
        // en ese caso las reiniciaba a su aspecto intacto. Solo se reacomodan cuando
        // el ancho del stage realmente cambia, y se les reaplica el estado actual.
        let lastStageWidth = stage.clientWidth;
        window.addEventListener('resize', () => {
            const currentWidth = stage.clientWidth;
            if (currentWidth === lastStageWidth) return;
            lastStageWidth = currentWidth;

            layoutHouses();
            layoutPalms();
            updateHouses(parseInt(volcanoSlider.value));
        });

        // Posición del sol según la hora real, fija al cargar (no se mueve con el slider)
        applySunPosition();
        document.getElementById('debugTimeInput').value =
            `${String(simulatedTime.getHours()).padStart(2, '0')}:${String(simulatedTime.getMinutes()).padStart(2, '0')}`;

        // Inicializar simulador en estado Inactivo (0%)
        updateVolcano(0);
    </script>
</body>
</html>
